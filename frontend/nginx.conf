server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Le rotte Angular sono gestite dal client: tutto ricade su index.html.
    # index.html non va mai messo in cache, altrimenti il browser continua a chiedere
    # i bundle della versione precedente dopo un nuovo deploy.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, must-revalidate";
    }

    # I file con hash nel nome cambiano a ogni build: si possono tenere in cache a lungo.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # L'API vive in un altro container della stessa rete compose.
    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
