# Tre container sulla stessa rete: database, API, frontend.
#   frontend (nginx, :8080) --/api--> api (NestJS, :3000) --> db (PostgreSQL, :5432)

services:
  db:
    image: postgres:16-alpine
    container_name: trust-tree-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: trust_tree
      POSTGRES_USER: trust
      POSTGRES_PASSWORD: trust
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d/migrations:ro
      - ./db/seed:/seed:ro
      - ./db/docker-init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trust -d trust_tree"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [trust-tree]

  api:
    build:
      context: ./api
    container_name: trust-tree-api
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: trust
      DB_PASSWORD: trust
      DB_NAME: trust_tree
      # In produzione va sostituito con un segreto reale.
      JWT_SECRET: ${JWT_SECRET:-trust-tree-sviluppo}
      JWT_SCADENZA: 12h
      DOCUMENTI_DIR: /app/uploads
    ports:
      - "3000:3000"
    volumes:
      # I documenti di verifica non stanno nell'immagine: vivono su un volume dedicato.
      - documenti:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://localhost:3000/api/questionario').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [trust-tree]

  frontend:
    build:
      context: ./frontend
    container_name: trust-tree-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_started
    networks: [trust-tree]

volumes:
  pgdata:
  documenti:

networks:
  trust-tree:
    driver: bridge
